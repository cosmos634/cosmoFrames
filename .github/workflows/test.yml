name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r python/requirements.txt
      - name: Install Node dependencies
        run: npm install
      - name: Run test suite
        run: npm test
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run render integration test
        run: |
          node dist/cli.js validate examples/vertical-demo/project.json
          node dist/cli.js preview examples/vertical-demo/project.json --time 1.5
          node dist/cli.js render examples/vertical-demo/project.json
          test -s examples/vertical-demo/cosmoframes-demo.mp4
          python tests/test_audio_render.py
